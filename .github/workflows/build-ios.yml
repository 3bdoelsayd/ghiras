name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean project
        run: flutter clean

      - name: Remove stale caches
        run: |
          rm -rf .dart_tool
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ~/.pub-cache
          rm -f pubspec.lock

      - name: Pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Verify app was built & inject assets
        run: |
          ls -la build/ios/iphoneos/ || true
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "App exists — continuing."
            if [ -f "assets/audio/azan_ios.mp3" ]; then
              cp assets/audio/azan_ios.mp3 build/ios/iphoneos/Runner.app/azan_ios.mp3
              echo "Successfully injected azan_ios.mp3 into Runner.app bundle."
            fi
          else
            echo "App was NOT built."
            exit 1
          fi

      - name: Create IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Ghiras.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghiras-iOS.ipa
          path: build/ios/iphoneos/Ghiras.ipa
