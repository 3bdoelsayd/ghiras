name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean project
        run: flutter clean

      - name: Remove stale caches
        run: |
          rm -rf .dart_tool
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ~/.pub-cache
          rm -f pubspec.lock

      - run: flutter pub get

      - name: Debug package resolution
        run: |
          python3 -c "
          import json
          data = json.load(open('.dart_tool/package_config.json'))
          names = [p['name'] for p in data['packages']]
          matches = [n for n in names if 'url_launcher' in n]
          print('Total packages:', len(names))
          print('url_launcher matches:', matches)
          print('Is url_launcher present exactly?', 'url_launcher' in names)
          print('Is url_launcher_ios present exactly?', 'url_launcher_ios' in names)
          "

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS app
        continue-on-error: true
        run: flutter build ios --release --no-codesign

      - name: Verify app was built
        run: |
          ls -la build/ios/iphoneos/ || true
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "App exists — continuing."
          else
            echo "App was NOT built."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ghiras-ios-app
          path: build/ios/iphoneos/Runner.app