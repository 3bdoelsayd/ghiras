name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean project
        run: flutter clean

      - run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned app via xcodebuild
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios_manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app was built
        run: |
          find build/ios_manual -name "Runner.app" -maxdepth 6

      - uses: actions/upload-artifact@v4
        with:
          name: ghiras-ios-app
          path: build/ios_manual/Build/Products/Release-iphoneos/Runner.app